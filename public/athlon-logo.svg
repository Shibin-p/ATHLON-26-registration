<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Athletic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Championship Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Handle & Accent Gradient -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern App Squircle Background -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />
  <!-- Inner Border for Depth -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Trophy Icon Group -->
  <g filter="url(#glow)">
    <!-- Left Trophy Handle -->
    <path d="M20 19 C13 19, 11 26, 17 33 C20 36.5, 23 37.5, 25 38"
          fill="none" stroke="url(#goldDark)" stroke-width="3" stroke-linecap="round" />

    <!-- Right Trophy Handle -->
    <path d="M44 19 C51 19, 53 26, 47 33 C44 36.5, 41 37.5, 39 38"
          fill="none" stroke="url(#goldDark)" stroke-width="3" stroke-linecap="round" />

    <!-- Trophy Main Cup Body -->
    <path d="M20 16 H44 V26 C44 33, 39 39, 32 39 C25 39, 20 33, 20 26 Z"
          fill="url(#goldGrad)" />

    <!-- Trophy Top Rim Highlight -->
    <path d="M19 15 C19 14.2, 20 13.5, 21.5 13.5 H42.5 C44 13.5, 45 14.2, 45 15 C45 15.8, 44 16.5, 42.5 16.5 H21.5 C20 16.5, 19 15.8, 19 15 Z"
          fill="#ffffff" opacity="0.9" />

    <!-- Trophy Stem / Neck -->
    <path d="M30 39 H34 V45 H30 Z"
          fill="url(#goldDark)" />

    <!-- Trophy Base / Pedestal -->
    <path d="M25 45 H39 L41 50 H23 Z"
          fill="url(#goldGrad)" />
    <!-- Pedestal Bottom Plate -->
    <rect x="21" y="50" width="22" height="3" rx="1.5" fill="#fef08a" />

    <!-- Cup Reflection / Athletic Star in Center -->
    <path d="M32 21 L33.4 25.2 L37.8 25.2 L34.2 27.8 L35.6 32 L32 29.4 L28.4 32 L29.8 27.8 L26.2 25.2 L30.6 25.2 Z"
          fill="#ffffff" opacity="0.95" />
  </g>
</svg>
